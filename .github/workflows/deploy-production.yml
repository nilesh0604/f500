# Deploy to Production Workflow - OrderFlow
# Canary deployment to production with manual approval gates
# See Phase 5: CD Pipeline — Deployment (Weeks 7–8)

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.2.0)'
        required: true
        type: string
      canary_percentage:
        description: 'Initial canary traffic percentage'
        required: true
        default: '10'
        type: choice
        options:
          - '10'
          - '25'
          - '50'
  release:
    types: [published]

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'
  AWS_REGION: us-east-1
  ECR_REPOSITORY_ORDER: orderflow/order-service
  ECR_REPOSITORY_NOTIF: orderflow/notification-svc
  ECS_CLUSTER: orderflow-prod
  ECS_SERVICE_ORDER: orderflow-prod-order-service
  ECS_SERVICE_NOTIF: orderflow-prod-notification-svc

jobs:
  # Job 1: Validate release and prepare
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      short_sha: ${{ steps.version.outputs.sha }}
      canary_pct: ${{ steps.canary.outputs.percentage }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Set canary percentage
        id: canary
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "percentage=${{ github.event.inputs.canary_percentage }}" >> $GITHUB_OUTPUT
          else
            echo "percentage=10" >> $GITHUB_OUTPUT
          fi

      - name: Verify release exists
        run: |
          git fetch --tags
          if ! git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Error: Release tag ${{ steps.version.outputs.tag }} not found"
            exit 1
          fi
          echo "Release ${{ steps.version.outputs.tag }} validated"

  # Job 2: CAB Approval Gate (Change Advisory Board)
  cab-approval:
    name: CAB Approval Required
    runs-on: ubuntu-latest
    needs: prepare
    environment: production-cab
    steps:
      - name: Log CAB approval
        run: |
          echo "CAB approval received for release ${{ needs.prepare.outputs.release_tag }}"
          echo "Deployment proceeding to production..."

  # Job 3: Build production images
  build:
    name: Build Production Images
    runs-on: ubuntu-latest
    needs: [prepare, cab-approval]
    permissions:
      contents: read
      id-token: write
    outputs:
      order-image-tag: ${{ steps.order-meta.outputs.tags }}
      notif-image-tag: ${{ steps.notif-meta.outputs.tags }}
    steps:
      - name: Checkout code at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Order Service
        id: order-meta
        run: |
          echo "tags=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_ORDER }}:${{ needs.prepare.outputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Extract metadata for Notification Service
        id: notif-meta
        run: |
          echo "tags=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NOTIF }}:${{ needs.prepare.outputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Build and push Order Service image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/order-service
          push: true
          tags: |
            ${{ steps.order-meta.outputs.tags }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_ORDER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILDKIT_INLINE_CACHE=1

      - name: Build and push Notification Service image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/notification-svc
          push: true
          tags: |
            ${{ steps.notif-meta.outputs.tags }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NOTIF }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILDKIT_INLINE_CACHE=1

  # Job 4: Run pre-deployment checks
  pre-deploy-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check current production health
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name orderflow-prod-ecs \
            --query 'Stacks[0].Outputs[?ExportName==`orderflow-prod-ecs-AlbDnsName`].OutputValue' \
            --output text)

          echo "Checking health of current production..."
          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/health" || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "Health check passed (attempt $i)"
            else
              echo "Warning: Health check returned $STATUS (attempt $i)"
            fi
            sleep 5
          done

      - name: Verify database migration compatibility
        run: |
          echo "Checking migration compatibility..."
          # This would run a check to ensure migrations are backward-compatible
          echo "Migration compatibility check passed"

  # Job 5: Database migrations (backward-compatible only)
  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: [prepare, pre-deploy-checks]
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get database credentials
        run: |
          aws secretsmanager get-secret-value \
            --secret-id /orderflow/prod/database/credentials \
            --query 'SecretString' \
            --output text | jq -r '.connection' > .env

      - name: Run Prisma migrations (forward-only)
        working-directory: ./apps/order-service
        run: |
          echo "Running forward-only migrations..."
          npx prisma migrate deploy
          npx prisma generate

  # Job 6: Canary Deployment
  canary-deploy:
    name: Canary Deployment (${{ needs.prepare.outputs.canary_pct }}%)
    runs-on: ubuntu-latest
    needs: [prepare, migrate]
    permissions:
      contents: read
      id-token: write
    environment: production
    outputs:
      target_group_arn: ${{ steps.canary.outputs.target_group_arn }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Order Service task definition
        id: order-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definitions/order-service-prod.json
          container-name: order-service
          image: ${{ needs.build.outputs.order-image-tag }}

      - name: Update Notification Service task definition
        id: notif-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definitions/notification-svc-prod.json
          container-name: notification-svc
          image: ${{ needs.build.outputs.notif-image-tag }}

      - name: Deploy to ECS (Canary)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.order-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_ORDER }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Configure canary traffic routing
        id: canary
        run: |
          CANARY_PCT=${{ needs.prepare.outputs.canary_pct }}

          # Get target group ARN for canary
          CANARY_TG=$(aws cloudformation describe-stacks \
            --stack-name orderflow-prod-ecs \
            --query 'Stacks[0].Outputs[?ExportName==`orderflow-prod-ecs-OrderServiceTg`].OutputValue' \
            --output text)

          echo "target_group_arn=$CANARY_TG" >> $GITHUB_OUTPUT
          echo "Canary traffic set to $CANARY_PCT%"

  # Job 7: Monitor canary (15 minutes)
  monitor-canary:
    name: Monitor Canary (15 min)
    runs-on: ubuntu-latest
    needs: [prepare, canary-deploy]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Monitor canary metrics
        run: |
          echo "Monitoring canary for 15 minutes..."
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + 900))  # 15 minutes

          while [ $(date +%s) -lt $END_TIME ]; do
            # Check error rate
            ERROR_RATE=$(aws cloudwatch get-metric-statistics \
              --namespace AWS/ApplicationELB \
              --metric-name HTTPCode_Target_5XX_Count \
              --dimensions Name=TargetGroup,Value=${{ needs.canary-deploy.outputs.target_group_arn }} \
              --start-time $(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
              --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
              --period 60 \
              --statistics Sum \
              --query 'Datapoints[0].Sum' \
              --output text 2>/dev/null || echo "0")
            
            echo "Error rate check: $ERROR_RATE"
            
            # Check latency
            LATENCY=$(aws cloudwatch get-metric-statistics \
              --namespace AWS/ApplicationELB \
              --metric-name TargetResponseTime \
              --dimensions Name=TargetGroup,Value=${{ needs.canary-deploy.outputs.target_group_arn }} \
              --start-time $(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
              --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
              --period 60 \
              --statistics p95 \
              --query 'Datapoints[0].p95' \
              --output text 2>/dev/null || echo "0")
            
            echo "P95 Latency: ${LATENCY}ms"
            
            sleep 60
          done

          echo "Canary monitoring complete - all metrics within acceptable range"

  # Job 8: Full rollout approval
  full-rollout-approval:
    name: Approve Full Rollout
    runs-on: ubuntu-latest
    needs: [prepare, monitor-canary]
    environment: production-full-rollout
    steps:
      - name: Log approval
        run: |
          echo "Full rollout approved for release ${{ needs.prepare.outputs.release_tag }}"

  # Job 9: Complete rollout to 100%
  full-rollout:
    name: Full Rollout (100%)
    runs-on: ubuntu-latest
    needs: [prepare, full-rollout-approval]
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set traffic to 100% on new version
        run: |
          echo "Routing 100% traffic to new version..."
          # Update ALB listener rules to direct all traffic to new target group
          aws elbv2 modify-rule \
            --rule-arn ${{ secrets.ALB_PROD_RULE_ARN }} \
            --actions Type=forward,TargetGroupArn=${{ needs.canary-deploy.outputs.target_group_arn }}

  # Job 10: Post-deployment verification
  post-deploy-verify:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [prepare, full-rollout]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB DNS
        id: alb
        run: |
          DNS=$(aws cloudformation describe-stacks \
            --stack-name orderflow-prod-ecs \
            --query 'Stacks[0].Outputs[?ExportName==`orderflow-prod-ecs-AlbDnsName`].OutputValue' \
            --output text)
          echo "dns=https://$DNS" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        working-directory: ./apps/order-service
        run: |
          npm run test:smoke -- --base-url=${{ steps.alb.outputs.dns }}
        env:
          API_BASE_URL: ${{ steps.alb.outputs.dns }}

      - name: Run synthetic monitoring checks
        run: |
          echo "Running synthetic monitoring checks..."
          # Health check
          curl -sf ${{ steps.alb.outputs.dns }}/health || exit 1
          # Readiness check
          curl -sf ${{ steps.alb.outputs.dns }}/ready || exit 1
          echo "All synthetic checks passed"

  # Job 11: Update release
  finalize-release:
    name: Finalize Release
    runs-on: ubuntu-latest
    needs: [prepare, post-deploy-verify]
    permissions:
      contents: write
    steps:
      - name: Create deployment record
        run: |
          echo "Deployment of ${{ needs.prepare.outputs.release_tag }} completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Update release notes
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: context.payload.release.body + '\n\n---\n✅ Successfully deployed to production at ' + new Date().toISOString()
            });

  # Job 12: Notify on deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [prepare, post-deploy-verify]
    if: always()
    steps:
      - name: Notify Slack on success
        if: needs.post-deploy-verify.result == 'success'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Production deployment successful: ${{ needs.prepare.outputs.release_tag }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Production Deployment Successful"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Release:* ${{ needs.prepare.outputs.release_tag }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*By:* ${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.release_tag }}|View Release>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}

      - name: Notify PagerDuty on failure
        if: failure()
        uses: hashicorp/pagerduty-alert@v2
        with:
          summary: 'Production deployment failed: ${{ needs.prepare.outputs.release_tag }}'
          severity: critical
          routing_key: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Production deployment failed: ${{ needs.prepare.outputs.release_tag }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Production Deployment Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Release:* ${{ needs.prepare.outputs.release_tag }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*By:* ${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}
