# Deploy to Staging Workflow - OrderFlow
# Automated deployment to staging environment on merge to main
# See Phase 5: CD Pipeline — Deployment (Weeks 7–8)

name: Deploy to Staging

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: staging-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'
  AWS_REGION: us-east-1
  ECR_REPOSITORY_ORDER: orderflow/order-service
  ECR_REPOSITORY_NOTIF: orderflow/notification-svc
  ECS_CLUSTER: orderflow-staging
  ECS_SERVICE_ORDER: orderflow-staging-order-service
  ECS_SERVICE_NOTIF: orderflow-staging-notification-svc

jobs:
  # Job 1: Build and push Docker images
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      order-image-tag: ${{ steps.order-meta.outputs.tags }}
      notif-image-tag: ${{ steps.notif-meta.outputs.tags }}
      short-sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Order Service
        id: order-meta
        run: |
          echo "tags=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_ORDER }}:staging-${{ steps.sha.outputs.short }}" >> $GITHUB_OUTPUT

      - name: Extract metadata for Notification Service
        id: notif-meta
        run: |
          echo "tags=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NOTIF }}:staging-${{ steps.sha.outputs.short }}" >> $GITHUB_OUTPUT

      - name: Build and push Order Service image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/order-service
          push: true
          tags: ${{ steps.order-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build and push Notification Service image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/notification-svc
          push: true
          tags: ${{ steps.notif-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # Job 2: Run database migrations
  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get database credentials
        run: |
          aws secretsmanager get-secret-value \
            --secret-id /orderflow/staging/database/credentials \
            --query 'SecretString' \
            --output text | jq -r '.connection' > .env

      - name: Run Prisma migrations
        working-directory: ./apps/order-service
        run: |
          npx prisma migrate deploy
          npx prisma generate

  # Job 3: Deploy to ECS Staging
  deploy:
    name: Deploy to ECS Staging
    runs-on: ubuntu-latest
    needs: [build, migrate]
    permissions:
      contents: read
      id-token: write
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Order Service ECS task definition
        id: order-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definitions/order-service-staging.json
          container-name: order-service
          image: ${{ needs.build.outputs.order-image-tag }}

      - name: Update Notification Service ECS task definition
        id: notif-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definitions/notification-svc-staging.json
          container-name: notification-svc
          image: ${{ needs.build.outputs.notif-image-tag }}

      - name: Deploy Order Service to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.order-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_ORDER }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Deploy Notification Service to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.notif-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NOTIF }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

  # Job 4: Run smoke tests
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      id-token: write
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB DNS
        id: alb
        run: |
          DNS=$(aws cloudformation describe-stacks \
            --stack-name orderflow-staging-ecs \
            --query 'Stacks[0].Outputs[?ExportName==`orderflow-staging-ecs-AlbDnsName`].OutputValue' \
            --output text)
          echo "dns=http://$DNS" >> $GITHUB_OUTPUT

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready..."
          sleep 30

      - name: Run smoke tests
        working-directory: ./apps/order-service
        run: |
          npm run test:smoke -- --base-url=${{ steps.alb.outputs.dns }}
        env:
          API_BASE_URL: ${{ steps.alb.outputs.dns }}

  # Job 5: Notify on deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: always()
    steps:
      - name: Notify Slack on success
        if: needs.deploy.result == 'success' && needs.smoke-tests.result == 'success'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Staging Deployment Successful"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:* ${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*By:* ${{ github.actor }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: needs.deploy.result == 'failure' || needs.smoke-tests.result == 'failure'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging deployment failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Staging Deployment Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:* ${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*By:* ${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
