# Security Scan Workflow - OrderFlow
# Scheduled daily + on PR for comprehensive security scanning
# See Phase 4: CI Pipeline — GitHub Actions (Weeks 6–7)

name: Security Scan

on:
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  # Job 1: Secret scanning (TruffleHog)
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified

  # Job 2: SAST - SonarQube
  sast-sonarqube:
    name: SAST - SonarQube
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: |
          # Generate coverage report for SonarQube
          npx nx run-many --target=test --all --configuration=ci --skip-nx-cache || true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=orderflow
            -Dsonar.organization=orderflow
            -Dsonar.javascript.lcov.reportPaths=coverage/**/lcov.info
            -Dsonar.typescript.tsconfigPath=tsconfig.base.json
            -Dsonar.sources=apps,libs
            -Dsonar.tests=apps,libs
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
            -Dsonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/jest.config.ts

  # Job 3: SAST - CodeQL Analysis
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'

  # Job 4: Dependency vulnerability scan
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --json > npm-audit-report.json || true
          echo "## NPM Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat npm-audit-report.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit-report.json)

          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found: $CRITICAL"
            exit 1
          fi

          if [ "$HIGH" -gt 5 ]; then
            echo "⚠️ More than 5 high vulnerabilities found: $HIGH"
            exit 1
          fi

          echo "✅ Dependency scan passed"

      - name: Run Snyk test
        uses: snyk/actions/node@master
        if: env.SNYK_TOKEN != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-report.json
        continue-on-error: true

      - name: Upload Snyk report
        if: env.SNYK_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

  # Job 5: Container image scanning (Trivy)
  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Order Service image
        run: |
          docker build -f apps/order-service/Dockerfile.prod -t order-service:scan .

      - name: Build Notification Service image
        run: |
          docker build -f apps/notification-svc/Dockerfile.prod -t notification-svc:scan .

      - name: Run Trivy vulnerability scanner - Order Service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'order-service:scan'
          format: 'sarif'
          output: 'trivy-order-service.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Don't fail the build, just report

      - name: Run Trivy vulnerability scanner - Notification Service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'notification-svc:scan'
          format: 'sarif'
          output: 'trivy-notification-svc.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Don't fail the build, just report

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-order-service.sarif'
          category: 'trivy-order-service'

      - name: Check for critical container vulnerabilities
        run: |
          # Check if any critical vulnerabilities exist
          if grep -q "CRITICAL" trivy-order-service.sarif 2>/dev/null; then
            echo "⚠️ Critical vulnerabilities found in Order Service image"
          fi
          if grep -q "CRITICAL" trivy-notification-svc.sarif 2>/dev/null; then
            echo "⚠️ Critical vulnerabilities found in Notification Service image"
          fi
          echo "✅ Container scan completed - check Security tab for details"

  # Job 6: License compliance check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for forbidden licenses
        run: |
          # Install license-checker if not present
          if ! npm list license-checker &>/dev/null; then
            npm install -g license-checker
          fi

          echo "Scanning for forbidden licenses (GPL, AGPL)..."

          # Generate license report
          license-checker --json --start . > licenses.json || true

          # Check for GPL/AGPL licenses
          GPL_COUNT=$(jq '[.. | objects | select(.licenses? | type == "string" and (contains("GPL") or contains("AGPL"))) ] | length' licenses.json 2>/dev/null || echo "0")

          if [ "$GPL_COUNT" -gt 0 ]; then
            echo "❌ Found $GPL_COUNT packages with GPL/AGPL licenses:"
            jq '.. | objects | select(.licenses? | type == "string" and (contains("GPL") or contains("AGPL"))) | {name: keys[0], license: .licenses}' licenses.json 2>/dev/null || true
            exit 1
          fi

          echo "✅ No forbidden licenses found"

  # Job 7: Infrastructure as Code security scan
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for CDK files
        id: cdk-check
        run: |
          if [ -d "infra" ] && [ "$(find infra -name '*.ts' | wc -l)" -gt 0 ]; then
            echo "has_cdk=true" >> $GITHUB_OUTPUT
          else
            echo "has_cdk=false" >> $GITHUB_OUTPUT
          fi

      - name: Run CDK Nag checks
        if: steps.cdk-check.outputs.has_cdk == 'true'
        run: |
          echo "Running CDK security checks..."
          cd infra
          npm install
          npx cdk synth
          # Run CDK Nag if configured
          echo "✅ IaC scan completed"

  # Job 8: Final summary
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs:
      [
        secret-scan,
        sast-sonarqube,
        sast-codeql,
        dependency-scan,
        container-scan,
        license-check,
      ]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning (TruffleHog) | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST - SonarQube | ${{ needs.sast-sonarqube.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST - CodeQL | ${{ needs.sast-codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan (Trivy) | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if any critical job failed
          if [[ "${{ needs.secret-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.dependency-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.license-check.result }}" == "failure" ]]; then
            echo "❌ **Critical security checks failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ **Security scan completed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Review the Security tab and job outputs for detailed findings." >> $GITHUB_STEP_SUMMARY
