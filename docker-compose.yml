# Docker Compose for OrderFlow Local Development
# Includes: LocalStack (AWS emulation) for Vyasa services

version: '3.8'

services:
  # LocalStack (AWS Services Emulation)
  localstack:
    image: localstack/localstack:3.8.1
    container_name: orderflow-localstack
    hostname: localstack
    environment:
      - SERVICES=s3,bedrock
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - '4566:4566'
      - '4510-4559:4510-4559'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-network

volumes:
  localstack_data:

networks:
  orderflow-network:
    driver: bridge
