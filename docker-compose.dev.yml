# Docker Compose for OrderFlow Development with Hot Reload
# Use this for active development with volume mounts and hot reload

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres-dev
    hostname: postgres
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orderflow -d orderflow_dev']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-dev-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: orderflow-redis-dev
    hostname: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orderflow-dev-network

  # LocalStack (AWS Services Emulation)
  localstack:
    image: localstack/localstack:latest
    container_name: orderflow-localstack-dev
    hostname: localstack
    environment:
      - SERVICES=sqs,events,secretsmanager
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEBUG=1
    ports:
      - '4566:4566'
    volumes:
      - localstack_dev_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-dev-network

  # Order Service (Development Mode with Hot Reload)
  order-service-dev:
    image: node:22-alpine
    container_name: orderflow-order-service-dev
    hostname: order-service
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://orderflow:orderflow@postgres:5432/orderflow_dev
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AWS_REGION: us-east-1
      EVENT_BUS_NAME: orderflow-event-bus
      LOCALSTACK_ENDPOINT: http://localstack:4566
      CORS_ORIGIN: http://localhost:4200
    ports:
      - '3001:3001'
    volumes:
      - .:/app:cached
      - /app/node_modules
      - /app/dist
    command: >
      sh -c "
        npm install --include=dev &&
        npx prisma generate --schema=apps/order-service/prisma/schema.prisma &&
        npx prisma migrate dev --schema=apps/order-service/prisma/schema.prisma &&
        npx nx serve order-service --watch
      "
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - orderflow-dev-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Notification Service (Development Mode with Hot Reload)
  notification-svc-dev:
    image: node:22-alpine
    container_name: orderflow-notification-svc-dev
    hostname: notification-svc
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3002
      AWS_REGION: us-east-1
      SQS_QUEUE_URL: http://localstack:4566/000000000000/orderflow-notifications
      LOCALSTACK_ENDPOINT: http://localstack:4566
      CORS_ORIGIN: http://localhost:4200
    ports:
      - '3002:3002'
    volumes:
      - .:/app:cached
      - /app/node_modules
      - /app/dist
    command: >
      sh -c "
        npm install --include=dev &&
        npx nx serve notification-svc --watch
      "
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orderflow-dev-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3002/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  postgres_dev_data:
  redis_dev_data:
  localstack_dev_data:

networks:
  orderflow-dev-network:
    driver: bridge
