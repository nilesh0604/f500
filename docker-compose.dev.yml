# Docker Compose for OrderFlow Development
# Local AWS services emulation for Vyasa RAG development

version: '3.8'

services:
  # LocalStack (AWS Services Emulation)
  localstack:
    image: localstack/localstack:latest
    container_name: orderflow-localstack-dev
    hostname: localstack
    environment:
      - SERVICES=s3,bedrock
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEBUG=1
    ports:
      - '4566:4566'
    volumes:
      - localstack_dev_data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-dev-network

volumes:
  localstack_dev_data:

networks:
  orderflow-dev-network:
    driver: bridge
